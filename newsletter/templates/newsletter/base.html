{% load static %}
<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Email News Automation</title>
    <link rel="stylesheet" href="{% static 'newsletter/styles.css' %}">
</head>
<body>
    <header class="topbar">
        <div>
            <strong>Email News Automation</strong>
            <span>Database-backed newsletter app</span>
        </div>
        <nav>
            <a href="{% url 'newsletter:recipients' %}">Recipients</a>
            <a href="{% url 'newsletter:campaigns' %}">Campaigns</a>
        </nav>
    </header>
    <main class="page">
        {% if messages %}
            <div class="messages">
                {% for message in messages %}
                    <div class="message {{ message.tags }}">{{ message }}</div>
                {% endfor %}
            </div>
        {% endif %}
        {% block content %}{% endblock %}
    </main>
</body>
</html>
